name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-lock.txt
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m venv .venv
          .venv/bin/pip install -r services/api/requirements-lock.txt
      - name: Dependency advisories and credential patterns
        run: |
          pnpm audit
          python -m venv /tmp/creditlens-audit
          /tmp/creditlens-audit/bin/pip install pip-audit==2.10.1
          /tmp/creditlens-audit/bin/pip-audit -r services/api/requirements-lock.txt
          .venv/bin/python scripts/check_secrets.py
      - name: Lint and type check
        run: |
          .venv/bin/ruff check services/api scripts/check_secrets.py
          pnpm lint
          pnpm typecheck
      - name: Formula, invalid data, API and model regression tests
        run: .venv/bin/python -m pytest services/api/tests -q
      - name: Build API and web
        run: |
          .venv/bin/python -m compileall -q services/api/app services/api/ml
          pnpm --filter web build
      - name: Browser user journey
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm --filter web test
